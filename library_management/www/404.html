<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>

    <style>
        /* Reset & Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background-color: #050505;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Ambient Background Spheres (Creates the backdrop behind the glass) */
        .glow-sphere {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            z-index: 1;
        }

        .sphere-1 {
            width: 320px;
            height: 320px;
            background: rgba(255, 255, 255, 0.12);
            top: 15%;
            left: 20%;
        }

        .sphere-2 {
            width: 400px;
            height: 400px;
            background: rgba(255, 255, 255, 0.08);
            bottom: 10%;
            right: 18%;
        }

        /* Glassmorphism Card Core */
        .glass-card {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 480px;
            padding: 3rem 2rem;
            text-align: center;
            border-radius: 24px;

            /* Frosted Glass Effect */
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);

            /* Subtle White Border & Inner Reflection */
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.8),
                inset 0 1px 1px rgba(255, 255, 255, 0.2);
        }

        /* Typography */
        .badge {
            display: inline-block;
            padding: 0.35rem 0.85rem;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: rgba(255, 255, 255, 0.7);
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            margin-bottom: 1rem;
        }

        .error-code {
            font-size: 6rem;
            font-weight: 800;
            line-height: 1;
            letter-spacing: -2px;
            background: linear-gradient(180deg, #ffffff 30%, rgba(255, 255, 255, 0.3) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        h2 {
            font-size: 1.5rem;
            font-weight: 500;
            margin-bottom: 0.75rem;
            color: #ffffff;
        }

        p {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.8rem 1.5rem;
            font-size: 0.9rem;
            font-weight: 500;
            border-radius: 12px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #ffffff;
            color: #000000;
            border: 1px solid #ffffff;
        }

        .btn-primary:hover {
            background: rgba(255, 255, 255, 0.85);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
        }
    </style>


</head>

<body>

    <!-- Background decorative ambient shapes for the glass blur effect -->
    <div class="glow-sphere sphere-1"></div>
    <div class="glow-sphere sphere-2"></div>

    <!-- Main Glass Container -->
    <main class="glass-card">
        <span class="badge">Error {{ http_status_code }}</span>
        <h1 class="error-code">404</h1>
        <h2>Lost in the Void</h2>
        <p>{{ user_message }}</p>
        <p>The page you are looking for doesn't exist, was removed, or is temporarily unavailable.</p>

        <div class="action-buttons">
            <a href="/" class="btn btn-primary">Return Home</a>
            <button onclick="history.back()" class="btn btn-secondary">Go Back</button>
        </div>
    </main>

</body>

</html>

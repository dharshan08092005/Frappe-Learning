{% extends "templates/web.html" %}

{% block page_content %}
<div class="container py-4">
    <h2>{{ doc.title or doc.name }}</h2>
    <span class="badge badge-info">{{ doc.status }}</span>
    <hr>
    <div class="row">
        <div class="col-md-8">
            <p>{{ doc.description or "No description provided." }}</p>
        </div>
        <div class="col-md-4">
            <p><strong>Created On:</strong> {{ doc.creation }}</p>
        </div>
    </div>
</div>
{% endblock %}
